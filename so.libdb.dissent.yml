id: so.libdb.dissent
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: dissent

sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/keyring # TODO: Check if this is even needed
  - --device=dri

modules:
  - name: libspelling
    buildsystem: meson
    config-opts:
      - -Ddocs=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libspelling.git
        tag: 0.4.9
        commit: e41e11d6ca6f5af987a46caa08036d5f0f629892
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: dissent
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      env:
        GOBIN: /app/bin
        GOROOT: /usr/lib/sdk/golang
    build-commands:
      - go install -v -mod=vendor ./...
      - desktop-file-edit --set-icon=$FLATPAK_ID --remove-key=DBusActivatable nix/$FLATPAK_ID.desktop
      - install -Dm644 nix/$FLATPAK_ID.desktop /app/share/applications/$FLATPAK_ID.desktop
      - install -Dm644 internal/icons/hicolor/scalable/apps/$FLATPAK_ID.svg /app/share/icons/hicolor/scalable/apps/$FLATPAK_ID.svg
      - install -Dm644 $FLATPAK_ID.metainfo.xml /app/share/metainfo/$FLATPAK_ID.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/diamondburned/dissent/archive/refs/tags/v0.0.37.tar.gz
        sha256: b08ae331e5c69759eb7b9511908007fc3e9c7a28208bfa66ffbd84b6f335364a
        x-checker-data:
          type: json
          url: https://api.github.com/repos/diamondburned/dissent/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/diamondburned/dissent/archive/refs/tags/" + .tag_name + ".tar.gz"'
          is-main-source: true

      - type: file
        url: https://raw.githubusercontent.com/diamondburned/dissent/3e4e73e0023a0f31854322e76460d4ea0bc01cbf/so.libdb.dissent.metainfo.xml
        sha256: b738d3add01cf33d4cd579e995781a27582e7e1a54f32fa569c2f967d48aa534
        x-checker-data:
          # The metainfo in each release tag lacks that release's entry; upstream
          # adds it in a follow-up commit, so track the latest commit to this file.
          type: json
          url: https://api.github.com/repos/diamondburned/dissent/commits?path=so.libdb.dissent.metainfo.xml&per_page=1
          version-query: .[0].sha
          url-query: '"https://raw.githubusercontent.com/diamondburned/dissent/" + .[0].sha + "/so.libdb.dissent.metainfo.xml"'

      - go.mod.yml
