id: so.libdb.dissent
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: dissent

sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/keyring # TODO: Check if this is even needed
  - --device=dri

modules:
  - name: libspelling
    buildsystem: meson
    config-opts:
      - -Ddocs=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libspelling.git
        tag: 0.4.10
        commit: 1facdde8e1c0fd72bed806f9a9be2fbec83af5f2
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: dissent
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      env:
        GOBIN: /app/bin
        GOROOT: /usr/lib/sdk/golang
    build-commands:
      - go install -v -mod=vendor ./...
      - desktop-file-edit --set-icon=$FLATPAK_ID --remove-key=DBusActivatable nix/$FLATPAK_ID.desktop
      - install -Dm644 nix/$FLATPAK_ID.desktop /app/share/applications/$FLATPAK_ID.desktop
      - install -Dm644 internal/icons/hicolor/scalable/apps/$FLATPAK_ID.svg /app/share/icons/hicolor/scalable/apps/$FLATPAK_ID.svg
      - install -Dm644 $FLATPAK_ID.metainfo.xml /app/share/metainfo/$FLATPAK_ID.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/diamondburned/dissent/archive/refs/tags/v0.0.41.tar.gz
        sha256: d31559e994798b47b3cf1440db3565fa0cfff7a9b1c67e49470509569cb8963e
        x-checker-data:
          type: json
          url: https://api.github.com/repos/diamondburned/dissent/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/diamondburned/dissent/archive/refs/tags/" + .tag_name + ".tar.gz"'
          is-main-source: true

      - type: file
        url: https://raw.githubusercontent.com/diamondburned/dissent/ef13f6cd98d0d22bff3c519a32f85772773d2801/so.libdb.dissent.metainfo.xml
        sha256: ec5762f0a010169c03f5e703ba72866ea761a1b997bccc4f17c78c5739c46f9f
        x-checker-data:
          # The metainfo in each release tag lacks that release's entry; upstream
          # adds it in a follow-up commit, so track the latest commit to this file.
          type: json
          url: https://api.github.com/repos/diamondburned/dissent/commits?path=so.libdb.dissent.metainfo.xml&per_page=1
          version-query: .[0].sha
          url-query: '"https://raw.githubusercontent.com/diamondburned/dissent/" + .[0].sha + "/so.libdb.dissent.metainfo.xml"'

      - go.mod.yml
